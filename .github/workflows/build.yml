name: Build CloudStream extension

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Verify catalogues and playback
        run: python3 scripts/health_check.py
      - name: Build extension and catalogue
        run: |
          chmod +x gradlew
          ./gradlew BroStreamFreshByFaz2:make makePluginsJson
          mkdir public
          cp EpornerGay/build/*.cs3 public/
          cp EpornerGay/build/BroStreamFreshByFaz2.cs3 public/BroStreamFreshByFaz2-v5.cs3
          jq 'map(.url = "https://raw.githubusercontent.com/efczpaclasses-boop/brostream-by-faz-2/builds/BroStreamFreshByFaz2-v5.cs3")' build/plugins.json > public/plugins-v5.json
          cp repo.json public/repo.json
          cp repo.json public/repo-v5.json
      - name: Publish builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./public
          force_orphan: true
