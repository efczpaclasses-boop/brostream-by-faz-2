name: Build CloudStream extension

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: extension-builds-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Test release packaging and HTTP validation offline
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build extension and catalogue
        run: |
          chmod +x gradlew
          ./gradlew BroStreamFreshByFaz2:testDebugUnitTest makePluginsJson
          python3 scripts/prepare_release.py \
            --plugins build/plugins.json \
            --artifacts EpornerGay/build \
            --repo repo.json \
            --output public \
            --repository "$GITHUB_REPOSITORY"
      - name: Check source markers and sampled stream responses
        run: python3 scripts/health_check.py
      - name: Publish builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./public
          keep_files: true
